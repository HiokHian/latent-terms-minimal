[project]
name = "latent-terms"
version = "0.1.0"
description = "Token-level Sparse Autoencoder on frozen dense retrievers for BM25-compatible sparse retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightning==2.6.5",
    "numpy==2.3.5",
    "torch==2.13.0",
    "transformers==5.14.1",
    "faiss-cpu==1.15.0",
    "wandb==0.28.1",
    "torchdata==0.11.0",
    "pyyaml==6.0.3",
    "tqdm==4.69.1",
    "beir==2.2.0",
    "hf-transfer==0.1.9",
    "scipy==1.18.0",
    "huggingface-hub==1.24.0",
    "fsspec==2026.6.0",
    "pyarrow==25.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latent_terms"]

[tool.uv]
package = true
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
